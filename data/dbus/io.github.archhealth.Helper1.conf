<?xml version="1.0" encoding="UTF-8"?>
<!-- /usr/share/dbus-1/system.d/io.github.archhealth.Helper1.conf
     Only root may own the name; anyone may call it, because every method
     is authorized by polkit (io.github.archhealth.read-privileged). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.archhealth.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.archhealth.Helper1"
           send_interface="io.github.archhealth.Helper1"/>
    <allow send_destination="io.github.archhealth.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.archhealth.Helper1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
