[package]
name = "arch-health-gui"
description = "GTK4 desktop frontend and tray monitor of arch-health"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "arch-health-gui"
path = "src/main.rs"

[dependencies]
arch-health-core.workspace = true
arch-health-adapters.workspace = true
arch-health-cli = { path = "../cli" }
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
pangocairo = "0.22"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus.workspace = true
