[package]
name = "arch-health"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm = "5"
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
roxmltree = "0.21.2"
rustix = { version = "1", features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
systemd = { version = "0.11", default-features = false, features = ["journal"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
zbus = "5"
